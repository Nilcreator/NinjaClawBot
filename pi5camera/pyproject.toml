[project]
name = "pi5camera"
version = "0.1.0"
description = "Standalone-first Raspberry Pi 5 camera tools for NinjaClawBot."
authors = [
    {name = "Nil Creator", email = "nilcreator@gmail.com"},
]
dependencies = [
    "click>=8.1",
    "numpy>=1.24",
    "pillow>=10.0",
    "face-recognition>=1.3; platform_system == 'Linux' and platform_machine != 'aarch64' and platform_machine != 'armv7l' and platform_machine != 'armv6l'",
]
requires-python = ">=3.11,<3.14"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
]

[project.scripts]
pi5camera = "pi5camera.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "W", "I"]
lint.ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
